# Palm Springs Paradise — locked CLI toolchain (Rokit)
# Promote to repo root: cp staging/toolchain/rokit.toml ./rokit.toml
# Install: rokit install  →  export PATH="$PWD/.rokit/bin:$PATH"

[tools]
rojo    = "rojo-rbx/rojo@7.4.4"
wally   = "UpliftGames/wally@0.3.2"
stylua  = "JohnnyMorganz/StyLua@2.0.2"
darklua = "seaofvoices/darklua@0.13.0"
remodel = "rojo-rbx/remodel@0.11.0"
selene  = "Kampfkarren/selene@0.28.0"
