# Promoted from staging/ci/pr-checks.yml — Luau quality on PRs
name: Palm Springs — PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [cursor/**]

jobs:
  luau-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit tools
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          # Root rokit.toml may symlink staging/toolchain/ — cp fails if same file
          rm -f rokit.toml wally.toml
          cp staging/toolchain/rokit.toml rokit.toml
          cp staging/toolchain/wally.toml wally.toml
          rokit install --no-trust-check
          echo "$PWD/.rokit/bin" >> $GITHUB_PATH

      - name: Wally install
        run: wally install

      - name: StyLua check
        run: stylua --check --config-path staging/toolchain/stylua.toml src/

      - name: Selene lint
        run: selene --allow-warnings --config staging/toolchain/selene.toml src/

      - name: Rojo build
        run: rojo build default.project.json -o build.rbxlx

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbxlx-build
          path: build.rbxlx
          if-no-files-found: error
